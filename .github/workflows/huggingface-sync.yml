name: Update email Hugging Face dataset

on:
  schedule:
    - cron: '19 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-huggingface-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Double-FW/Accessible-Email-Design' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_DATASET_ID: ${{ vars.HF_DATASET_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check destination setting
        run: python -c "import os,sys; sys.path.insert(0,'scripts'); from email_hf_common import destination; destination(os.environ.get('HF_DATASET_ID',''))"
      - name: Install publishing dependency
        run: python -m pip install -r huggingface/requirements.txt
      - name: Check documentation and test export safeguards
        run: |
          python scripts/export_huggingface.py --check-only
          python -m unittest discover -s tests -v
      - name: Build and validate the email dataset
        run: python scripts/export_huggingface.py --output "${RUNNER_TEMP}/email-dataset" --dataset-id "$HF_DATASET_ID"
      - name: Publish to the configured dataset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_huggingface.py --folder "${RUNNER_TEMP}/email-dataset" --dataset-id "$HF_DATASET_ID"
